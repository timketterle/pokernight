body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 70% at 50% 50%,rgba(8,8,10,.35),rgba(8,8,10,.75))}
main{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.box{width:min(560px,100%);text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);border-radius:22px;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);padding:44px 32px 36px}

.sub{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:34px}
.btns{display:grid;gap:12px}
a.b{display:block;text-decoration:none;font-weight:600;font-size:18px;padding:18px 20px;border-radius:14px;transition:background .2s}
a.b.w{background:#fff;color:#111}
a.b.w:hover{background:#ececea}
a.b.g{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
a.b.g:hover{background:rgba(255,255,255,.2)}
</style>
